        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyCpIyH2_HHFpkatGdpbNeGcugPRvkMK-ok",
            authDomain: "mbsfzuko-workshop.firebaseapp.com",
            projectId: "mbsfzuko-workshop",
            storageBucket: "mbsfzuko-workshop.firebasestorage.app",
            messagingSenderId: "613261271832",
            appId: "1:613261271832:web:610e7609b367cae0da746d"
        };

        // --- GOOGLE SHEETS AUTOMATION (Updated URL) ---
        const googleScriptURL = "https://script.google.com/macros/s/AKfycbztE3qQFWOADK9jj6bIxPaal18DPIt3r00CrbYqGFFMo-3gigEuWMzAJrkGyIEN86c3/exec"; 

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'workshop-rsvp-2026';

        let state = {
            view: 'landing',
            user: null,
            registrations: [],
            loading: false,
            isAdminAuthenticated: false,
            showAbstract: false,
            activeTab: 'sun' // Options: sun, mon, tue, wed
        };

        async function initAuth() {
            try {
                await signInAnonymously(auth);
            } catch (e) {
                console.error("Auth error:", e);
            }
            onAuthStateChanged(auth, (u) => {
                state.user = u;
                render();
            });
        }

        window.setView = (v) => {
            state.view = v;
            state.showAbstract = false;
            render();
            window.scrollTo(0,0);
        };

        window.toggleAbstract = (bool) => {
            state.showAbstract = bool;
            document.body.style.overflow = bool ? 'hidden' : 'auto';
            render();
        };

        window.setProgramTab = (tabId) => {
            state.activeTab = tabId;
            render();
        };

        window.handleRSVP = async (event) => {
            event.preventDefault();
            if (!state.user) return;
            
            const formData = new FormData(event.target);
            const data = {
                name: formData.get('name'),
                email: formData.get('email'),
                affiliation: formData.get('affiliation'),
                researchField: formData.get('researchField'),
                participation: {
                    sunday: formData.get('attending_sunday') === 'on',
                    monday_pract: formData.get('attending_monday_pract') === 'on',
                    monday_excur: formData.get('attending_monday_excur') === 'on',
                    tuesday: formData.get('attending_tuesday') === 'on'
                },
                dietary: formData.get('dietary'),
                timestamp: serverTimestamp(),
                userId: state.user.uid
            };

            state.loading = true;
            render();

            try {
                // 1. Save to Firebase
                const registrationsCol = collection(db, 'artifacts', appId, 'public', 'data', 'registrations');
                await addDoc(registrationsCol, data);

                // 2. Sync to Google Sheets
                if (googleScriptURL) {
                    fetch(googleScriptURL, {
                        method: 'POST',
                        mode: 'no-cors', 
                        cache: 'no-cache',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    }).catch(err => console.error("Google Sheets Sync Error:", err));
                }

                state.view = 'success';
            } catch (e) {
                console.error(e);
                alert("Error saving registration. Please check if Firestore Database rules have been updated.");
            } finally {
                state.loading = false;
                render();
                window.scrollTo(0,0);
            }
        };

        window.tryAdminLogin = (event) => {
            if (event) event.preventDefault();
            const pw = document.getElementById('admin-pw').value;
            if (pw === '2026') {
                state.isAdminAuthenticated = true;
                state.view = 'admin-dashboard';
                setupAdminListener();
            } else {
                alert("Incorrect access code.");
            }
            render();
        };

        function setupAdminListener() {
            if (!state.user || !state.isAdminAuthenticated) return;
            const registrationsCol = collection(db, 'artifacts', appId, 'public', 'data', 'registrations');
            onSnapshot(registrationsCol, (snapshot) => {
                state.registrations = snapshot.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                render();
            });
        }

        window.deleteEntry = async (id) => {
            if (!confirm("Remove this registration?")) return;
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'registrations', id));
        };
